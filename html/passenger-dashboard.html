<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger | MerryLift</title>
    <link rel="stylesheet" href="../css/passenger-dashboard.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <a href="../html/passenger-dashboard.html">
                        <img src="../images/merrylift-transparent.png" alt="Logo">
                    </a>
                </div>
                <ul class="nav-menu" id="navMenu"></ul>
                <div class="nav-buttons">
                    <button class="btn-Outline" onclick="window.location.href='../html/driver-registration.html'">Become a Driver</button>
                    <!-- Profile dropdown -->
                    <div class="profile-dropdown">
                        <button class="profile-btn" id="profileBtn">
                            <img id="profileImage" src="../images/default-avatar.png" alt="Profile" class="profile-icon">
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="../html/passenger-profile.html">Profile</a>
                            <a href="../html/passenger-settings.html">Settings</a>
                            <hr>
                            <a href="../index.html">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Map Popup Modal for Route Display -->
    <div id="mapPopupModal" class="map-popup-modal" style="display: none;">
        <div class="map-popup-content">
            <div class="map-popup-header">
                <h2>Route Details</h2>
                <button class="close-popup" onclick="closeMapPopup()">&times;</button>
            </div>
            <div id="popupMapContainer" class="popup-map-container"></div>
        </div>
    </div>

    <style>
        .map-popup-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .map-popup-modal.show {
            display: flex !important;
        }

        .map-popup-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .map-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .map-popup-header h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }

        .close-popup {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-popup:hover {
            color: #333;
        }

        .popup-map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            border-radius: 0 0 12px 12px;
        }
    </style>




    <script src="../js/modules/passengerTracker.js"></script>
    <script src="../js/passenger-dashboard.js"></script>
</body>
</html>
