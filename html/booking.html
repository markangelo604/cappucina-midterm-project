<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - MerryLift</title>
    <link rel="stylesheet" href="../css/booking.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <img src="../images/merrylift-transparent.png" alt="Logo">
                </div>
                <ul id="navMenu" class="nav-menu"></ul>
                <div class="nav-buttons">
                    <button class="btn-Outline" onclick="window.location.href='../html/driver-registration.html'">Become a Driver</button>
                    <button class="btn-primary" onclick="window.location.href='../index.html'">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Booking Section -->
    <section class="booking-section">
        <div class="container">
            <div class="booking-header">
                <h1>My Bookings</h1>
                <p>View and manage your ride bookings</p>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-container">
                <span class="filter-label">Filter by:</span>
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all">All</button>
                    <button class="tab-btn" data-filter="confirmed">Upcoming</button>
                    <button class="tab-btn" data-filter="completed">Completed</button>
                    <button class="tab-btn" data-filter="cancelled">Cancelled</button>
                </div>
            </div>

            <!-- Booking Cards -->
            <div id="bookingsList" class="bookings-list"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content" id="footerContent"></div>
            <div class="footer-bottom">
                <p>&copy; <span id="year"></span> MerryLift. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/booking-config.js"></script>

</body>
</html>
