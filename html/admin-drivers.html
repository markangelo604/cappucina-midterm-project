<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers - MerryLift Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin-dashboard.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="../images/merrylift-transparent.png" alt="MerryLift Logo" class="logo-image">
                <span>MerryLift</span>
            </div>
        </div>
        
        <div class="sidebar-menu">
            <div class="menu-section">
                <a href="admin-dashboard.html" class="menu-item">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </div>
            
            <div class="menu-section">
                <p class="menu-label">MANAGEMENT</p>
                <a href="admin.html" class="menu-item">
                    <i class="bi bi-person-badge"></i>
                    <span>Admin</span>
                </a>
                <a href="admin-users.html" class="menu-item">
                    <i class="bi bi-person"></i>
                    <span>Users</span>
                </a>
                <a href="admin-drivers.html" class="menu-item active">
                    <i class="bi bi-people"></i>
                    <span>Drivers</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navigation -->
        <nav class="top-navbar">
            <button class="btn-toggle" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            
            <div class="navbar-right">
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search...">
                </div>
                
                <div class="admin-profile">
                    <span class="admin-name">Admin</span>
                    <div class="admin-avatar">
                        <i class="bi bi-person-circle"></i>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Drivers Page -->
        <div class="content-area">
            <div class="page-header-admin">
                <h1>DRIVERS</h1>
            </div>

            <!-- Search and Filters -->
            <div class="search-filter-bar">
                <div class="filter-group">
                    <label>SEARCH:</label>
                    <select class="filter-select" id="searchType">
                        <option>All</option>
                        <option>Name</option>
                        <option>Email</option>
                        <option>License</option>
                    </select>
                    <input type="text" class="filter-input" id="searchInput" placeholder="🔍">
                </div>
                
                <div class="filter-group">
                    <select class="filter-select" id="statusFilter">
                        <option value="">Select Status</option>
                        <option value="active">Active</option>
                        <option value="on-duty">On Duty</option>
                        <option value="off-duty">Off Duty</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <select class="filter-select" id="verificationFilter">
                        <option value="">Select Verification</option>
                        <option value="verified">Verified</option>
                        <option value="pending">Pending</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                
                <button class="btn-search" id="searchBtn">Search</button>
                <button class="btn-reset" id="resetBtn">Reset</button>
                <button class="btn-add" data-bs-toggle="modal" data-bs-target="#addDriverModal">ADD</button>
            </div>

            <!-- Drivers Table -->
            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>EMAIL</th>
                            <th>LICENSE NO.</th>
                            <th>VEHICLE</th>
                            <th>VERIFICATION</th>
                            <th>STATUS</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="driversTableBody">
                        <!-- Table rows will be dynamically generated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Driver Modal -->
    <div class="modal fade" id="addDriverModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Driver</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addDriverForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">License Number</label>
                            <input type="text" class="form-control" name="license" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vehicle Model</label>
                            <input type="text" class="form-control" name="vehicle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Plate Number</label>
                            <input type="text" class="form-control" name="plate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Verification Status</label>
                            <select class="form-select" name="verification" required>
                                <option value="">Select Verification</option>
                                <option value="verified">Verified</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status" required>
                                <option value="active">Active</option>
                                <option value="off-duty">Off Duty</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="addDriverBtn">Add Driver</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/admin-drivers.js"></script>
</body>
</html>
